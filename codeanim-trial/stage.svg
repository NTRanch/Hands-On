<svg class="stage" viewBox="0 0 800 520" id="stage">
      <defs>
        <!-- HOUSE CEL eyes (SPEC §7). One eye, centered on (0,0),
             instanced per side with <use>. THE EYE RULE: the pupil
             is a HEART in every state; the iris stays Opal's
             canonical warm amber-brown — heart is shape only.
             States differ by lid, gaze, catchlights and pupil
             luminosity — never by pupil shape or iris color. -->
        <path id="heartPupil" d="M0 3.9 C-1.1 1.7 -5.3 -0.7 -5.3 -3.2 C-5.3 -5.8 -2 -6.5 0 -4 C2 -6.5 5.3 -5.8 5.3 -3.2 C5.3 -0.7 1.1 1.7 0 3.9 Z"/>
        <path id="sparkStar" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#fff3b0"/>
        <g id="eyeOpen">
          <ellipse rx="10.5" ry="13" fill="#ffffff"/>
          <circle r="7.6" cy="0.5" fill="#a34d16"/>
          <path d="M-9 -6.5 Q0 -13 9 -6.5 Q0 -10 -9 -6.5 Z" fill="#7c3510" opacity="0.35"/>
          <use href="#heartPupil" fill="#2a1208"/>
          <circle cx="-3.1" cy="-4.6" r="2.3" fill="#ffffff"/>
          <circle cx="3.4" cy="3.6" r="1.2" fill="#ffffff" opacity="0.9"/>
          <path d="M-11 -8 Q0 -16.5 11 -8" stroke="#2a1610" stroke-width="3.6" fill="none" stroke-linecap="round"/>
          <ellipse rx="10.5" ry="13" fill="none" stroke="#2a1610" stroke-width="2.6"/>
        </g>
        <g id="eyeHalf">
          <ellipse rx="10.5" ry="8.5" cy="2.5" fill="#ffffff"/>
          <circle r="6.6" cy="4" fill="#a34d16"/>
          <use href="#heartPupil" transform="translate(0 4) scale(0.82)" fill="#2a1208"/>
          <circle cx="-2.8" cy="0.5" r="1.9" fill="#ffffff"/>
          <path d="M-11.5 -2 Q0 -9 11.5 -2" stroke="#2a1610" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse rx="10.5" ry="8.5" cy="2.5" fill="none" stroke="#2a1610" stroke-width="2.6"/>
        </g>
        <g id="eyeUp">
          <ellipse rx="10.5" ry="12" fill="#ffffff"/>
          <circle r="7.2" cy="-3.4" fill="#a34d16"/>
          <use href="#heartPupil" transform="translate(0 -3.4)" fill="#2a1208"/>
          <circle cx="-3" cy="-7.6" r="2.1" fill="#ffffff"/>
          <circle cx="3.2" cy="0.4" r="1.1" fill="#ffffff" opacity="0.9"/>
          <path d="M-10.5 5.5 Q0 12.5 10.5 5.5" stroke="#2a1610" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M-11 -7.5 Q0 -15.5 11 -7.5" stroke="#2a1610" stroke-width="3.6" fill="none" stroke-linecap="round"/>
          <ellipse rx="10.5" ry="12" fill="none" stroke="#2a1610" stroke-width="2.6"/>
        </g>
        <g id="eyeMelt">
          <ellipse rx="10.5" ry="9.5" cy="2" fill="#ffffff"/>
          <circle r="6.9" cy="-0.5" fill="#a34d16"/>
          <use href="#heartPupil" transform="translate(0 -0.5)" fill="#ff4d94"/>
          <use href="#heartPupil" transform="translate(0 -0.5) scale(0.45)" fill="#ffd7ea"/>
          <circle cx="-2.9" cy="-4.4" r="2" fill="#ffffff"/>
          <path d="M-11.5 -3.5 Q0 -11 11.5 -3.5" stroke="#2a1610" stroke-width="4.6" fill="none" stroke-linecap="round"/>
          <path d="M-10.5 7 Q0 13.5 10.5 7" stroke="#2a1610" stroke-width="2.8" fill="none" stroke-linecap="round"/>
          <ellipse rx="10.5" ry="9.5" cy="2" fill="none" stroke="#2a1610" stroke-width="2.6"/>
        </g>
      </defs>
      <!-- fence (both views lean on the same fence line) -->
      <g stroke="#8a5a2b" stroke-width="14"><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="360" x2="800" y2="360"/></g>
      <g fill="#a06a35"><rect x="60" y="240" width="22" height="190"/><rect x="330" y="240" width="22" height="190"/>
      <rect x="470" y="240" width="22" height="190"/><rect x="720" y="240" width="22" height="190"/></g>

      <!-- ===== LEFT: rear view ===== -->
      <g id="rearView">
        <path d="M120 470 q10-120 30-170 q40-40 90 0 q20 50 30 170 z" fill="#9c5220" stroke="#2a1610" stroke-width="3.5"/><!-- hair back -->
        <path d="M228 306 q22 54 30 164 l-26 0 q-4-96-4-164z" fill="#6e3510"/><!-- hair shadow mass, hard edge -->
        <path d="M140 330 q55-45 110 0 l14 110 q-69 25-138 0 z" fill="#fff3d6" stroke="#2a1610" stroke-width="3.5"/><!-- outfit back -->
        <path d="M140 330 q55-45 110 0 l3 22 q-58-34-116 0z" fill="#ecd9a8"/><!-- outfit shadow band -->
        <g fill="#241a20"><ellipse cx="170" cy="370" rx="16" ry="11"/><ellipse cx="225" cy="410" rx="13" ry="9"/></g>
        <g id="tail" style="transform-origin:262px 350px">
          <path d="M262 350 q40 30 26 84" stroke="#9c5220" stroke-width="10" fill="none" stroke-linecap="round"/>
          <ellipse cx="288" cy="440" rx="10" ry="16" fill="#6e3510"/>
        </g>
        <ellipse cx="150" cy="300" rx="18" ry="12" fill="#ffd9b3" stroke="#2a1610" stroke-width="3"/><!-- ear -->
        <ellipse cx="240" cy="300" rx="18" ry="12" fill="#ffd9b3" stroke="#2a1610" stroke-width="3"/>
      </g>
      <!-- bucket under rear view -->
      <g>
        <path d="M150 500 l12-52 h76 l12 52 z" fill="#5b6b7a" stroke="#33404c" stroke-width="3"/>
        <clipPath id="bucketClip"><path d="M150 500 l12-52 h76 l12 52 z"/></clipPath>
        <g clip-path="url(#bucketClip)"><rect id="bucketFill" x="145" y="500" width="110" height="0" fill="#fff6ea"/></g>
      </g>
      <text x="200" y="518" text-anchor="middle" font-size="13" fill="#33404c">bucket</text>

      <!-- ===== RIGHT: front view ===== -->
      <g id="frontView">
        <path d="M520 330 q80-55 160 0 l18 130 q-98 30-196 0 z" fill="#fff3d6" stroke="#2a1610" stroke-width="3.5"/><!-- outfit -->
        <path d="M508 446 q92 28 184 0 l3 14 q-95 30-190 0z" fill="#ecd9a8"/><!-- outfit shadow band -->
        <g fill="#241a20"><ellipse cx="560" cy="380" rx="18" ry="12"/><ellipse cx="640" cy="425" rx="15" ry="10"/><ellipse cx="600" cy="355" rx="12" ry="8"/></g>
        <!-- chest: scale driven by squeeze parameter + spring jiggle + fullness -->
        <g id="chest" style="transform-origin:600px 345px">
          <ellipse cx="562" cy="345" rx="40" ry="32" fill="#ffd9b3" stroke="#2a1610" stroke-width="3.5"/>
          <ellipse cx="638" cy="345" rx="40" ry="32" fill="#ffd9b3" stroke="#2a1610" stroke-width="3.5"/>
          <path d="M528 358 q34 22 68 0 q-34 9-68 0z M604 358 q34 22 68 0 q-34 9-68 0z" fill="#f2a56b"/><!-- hard cel shadow crescents -->
          <ellipse cx="548" cy="330" rx="11" ry="5" fill="#ffffff" opacity="0.55"/>
          <ellipse cx="624" cy="330" rx="11" ry="5" fill="#ffffff" opacity="0.55"/>
          <path d="M522 330 q40-22 80 0 q-40 16-80 0z M598 330 q40-22 80 0 q-40 16-80 0z" fill="#fff3d6" stroke="#2a1610" stroke-width="2.5"/>
        </g>
        <!-- POV hands (position animated to the squeezed side) -->
        <g id="handL" opacity="0"><ellipse cx="520" cy="345" rx="26" ry="20" fill="#ffd9b3" stroke="#2a1610" stroke-width="3"/><path d="M500 330 q20-14 40 0" stroke="#c47b43" stroke-width="5" fill="none"/></g>
        <g id="handR" opacity="0"><ellipse cx="680" cy="345" rx="26" ry="20" fill="#ffd9b3" stroke="#2a1610" stroke-width="3"/><path d="M660 330 q20-14 40 0" stroke="#c47b43" stroke-width="5" fill="none"/></g>
        <!-- head -->
        <g id="head">
          <ellipse cx="540" cy="205" rx="20" ry="13" fill="#ffd9b3" stroke="#2a1610" stroke-width="3"/><ellipse cx="660" cy="205" rx="20" ry="13" fill="#ffd9b3" stroke="#2a1610" stroke-width="3"/><!-- ears -->
          <path d="M548 178 q-8-26 10-34 q10 16 2 32z M652 178 q8-26-10-34 q-10 16-2 32z" fill="#f3e3c2" stroke="#2a1610" stroke-width="3"/><!-- horns -->
          <circle cx="600" cy="240" r="62" fill="#ffd9b3" stroke="#2a1610" stroke-width="3.5"/>
          <path d="M564 290 q36 18 72 0 q-36 9-72 0z" fill="#f2a56b" opacity="0.85"/><!-- chin shadow, hard edge -->
          <path d="M538 238 q-4-72 62-78 q66 6 62 78 q-2-44-30-52 q10 14 4 22 q-14-26-36-26 q-22 0-36 26 q-6-8 4-22 q-28 8-30 52z" fill="#9c5220" stroke="#2a1610" stroke-width="3.5"/><!-- hair -->
          <path d="M600 162 q40 3 54 34 q-16-16-54-18 q-38 2-54 18 q14-31 54-34z" fill="#6e3510"/><!-- hair shadow mass -->
          <path d="M548 200 q52-30 104 0 q-52-17-104 0z" fill="#d98a44" opacity="0.9"/><!-- hair highlight band -->
          <g id="blush" opacity="0" fill="#ff8fab"><ellipse cx="560" cy="263" rx="13" ry="7"/><ellipse cx="640" cy="263" rx="13" ry="7"/><ellipse cx="562" cy="264" rx="7" ry="4" fill="#ff6b93"/><ellipse cx="638" cy="264" rx="7" ry="4" fill="#ff6b93"/></g>
          <!-- eyes: four authored House Cel layers, cross-faded by the
               state machine — open → heavy-lidded → gaze-up → the melted
               torogao layer. TEACHING NOTE: the governed climax expression
               ("torogao face") is a NAMED expression = a parameter recipe,
               reached by smooth parameter travel, never a cut. The eye
               rule binds every layer: heart pupils, her own iris color. -->
          <g id="eyesOpen" class="faceLayer"><use href="#eyeOpen" transform="translate(578 242)"/><use href="#eyeOpen" transform="translate(622 242)"/></g>
          <g id="eyesHalf" class="faceLayer" opacity="0"><use href="#eyeHalf" transform="translate(578 243)"/><use href="#eyeHalf" transform="translate(622 243)"/></g>
          <g id="eyesUp" class="faceLayer" opacity="0"><use href="#eyeUp" transform="translate(578 242)"/><use href="#eyeUp" transform="translate(622 242)"/></g>
          <g id="eyesMelt" class="faceLayer" opacity="0"><use href="#eyeMelt" transform="translate(578 243)"/><use href="#eyeMelt" transform="translate(622 243)"/></g>
          <g id="sparkles" class="faceLayer" opacity="0"><use href="#sparkStar" transform="translate(556 220)"/><use href="#sparkStar" transform="translate(648 214) scale(0.7)"/><use href="#sparkStar" transform="translate(640 264) scale(0.55)"/></g>
          <path id="mouthSmile" class="faceLayer" d="M586 268 q14 10 28 0" stroke="#7a3520" stroke-width="5" fill="none" stroke-linecap="round"/>
          <g id="mouthOpen" class="faceLayer" opacity="0"><ellipse cx="600" cy="273" rx="10" ry="13" fill="#7c2a2a"/><ellipse cx="600" cy="279" rx="6.5" ry="5" fill="#ff8fab"/></g>
          <g id="hearts" opacity="0" fill="#ff2e88"><path d="M540 168 c-6-10-24-6-24 6 c0 10 12 16 24 26 c12-10 24-16 24-26 c0-12-18-16-24-6z"/><path d="M668 150 c-5-8-19-5-19 5 c0 8 10 13 19 21 c9-8 19-13 19-21 c0-10-14-13-19-5z" transform="scale(0.8) translate(160,40)"/></g>
          <path d="M584 296 h32" stroke="#c9a227" stroke-width="5"/><!-- choker -->
          <circle id="bell" cx="600" cy="308" r="10" fill="#f2c531" stroke="#2a1610" stroke-width="2"/>
        </g>
      </g>
      <text x="200" y="30" font-size="16" fill="#33404c">rear view</text>
      <text x="600" y="30" text-anchor="middle" font-size="16" fill="#33404c">front view — Opal</text>
    </svg>